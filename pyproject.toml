[project]
name = "file-defender"
version = "0.1.0"
description = "AI/ML file-system behavior anomaly detection for ransomware defense"
readme = "README.md"

# Linux Mint 22.3 ships Python 3.12.
requires-python = ">=3.12,<3.13"

# Minimal dependencies for the offline ML pipeline (training + verification).
# The collector and daemon are C/C++ and are built with CMake, not uv.
dependencies = [
    "numpy",
    "pandas",
    "scikit-learn",
    "joblib",
    "ruff",
]

[tool.uv]
# Virtual project: there is no Python package to build. The scripts in python/
# are run directly.
package = false
# Resolve for both target platforms so uv.lock works on the Linux Mint machine
# the daemon is built on and on the Windows box the Python side is developed on.
# macOS is not a target: the collectors need fanotify and eBPF.
required-environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
]

[tool.ruff]
extend-include = ["*.ipynb"]
lint.extend-select = ["I", "C4", "ISC", "SIM", "TCH"]
lint.ignore = []
show-fixes = true
target-version = "py312"
